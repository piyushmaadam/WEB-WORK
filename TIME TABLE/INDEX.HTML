<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Timetable Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --primary: #4a00e0;
      --primary-light: #8e2de2;
      --bg-gradient-start: #667eea;
      --bg-gradient-end: #764ba2;
      --card-radius: 15px;
      --shadow-elevated: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #fff;
      border-radius: var(--card-radius);
      box-shadow: var(--shadow-elevated);
      overflow: hidden;
    }

    header {
      background: var(--primary);
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 2.1rem;
    }

    header p {
      margin: 5px 0 0;
      font-size: 0.95rem;
      opacity: 0.9;
    }

    main {
      display: block;
    }

    .controls {
      padding: 20px;
      background: #f8f9fa;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      align-items: center;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 140px;
    }

    label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #555;
    }

    input[type="time"],
    select {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 0.95rem;
      outline: none;
      min-width: 120px;
      background-color: #fff;
    }

    input[type="time"]:focus,
    select:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 2px rgba(142, 45, 226, 0.2);
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      padding: 10px 18px;
      background: var(--primary-light);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    button:hover {
      background: #7900c2;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
      box-shadow: none;
    }

    #timetableContainer {
      padding: 0 20px 20px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 700px;
      border-collapse: collapse;
      margin-top: 20px;
      border-radius: 10px;
      overflow: hidden;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
      position: relative;
    }

    th {
      background: var(--primary);
      color: white;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tr:nth-child(even) td:not(.time-cell) {
      background-color: #fafafa;
    }

    td:hover {
      background: #f5f0ff;
    }

    .time-cell {
      font-weight: 600;
      background: #f3f4ff;
      width: 120px;
      white-space: nowrap;
      position: sticky;
      left: 0;
      z-index: 2;
    }

    .subject-input {
      width: 100%;
      border: none;
      background: transparent;
      text-align: center;
      font-size: 0.95rem;
      padding: 6px 4px;
      border-radius: 6px;
    }

    .subject-input::placeholder {
      color: #bbb;
      font-size: 0.9rem;
    }

    .subject-input:focus {
      outline: 2px solid var(--primary-light);
      background: #fff;
    }

    .cell-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .color-picker {
      width: 32px;
      height: 32px;
      border: none;
      cursor: pointer;
      padding: 0;
      background: transparent;
    }

    .info-text {
      font-size: 0.8rem;
      color: #666;
      text-align: center;
      padding: 0 20px 10px;
    }

    footer {
      text-align: center;
      padding: 15px;
      background: #333;
      color: #ddd;
      font-size: 0.85rem;
      margin-top: 20px;
      border-radius: 0 0 var(--card-radius) var(--card-radius);
    }

    @media (max-width: 768px) {
      header h1 {
        font-size: 1.7rem;
      }

      .controls {
        align-items: stretch;
      }

      .control-group {
        flex: 1 1 100%;
      }

      table {
        font-size: 0.85rem;
      }

      .time-cell {
        font-size: 0.8rem;
      }
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }

      .controls,
      header,
      footer,
      .info-text {
        display: none !important;
      }

      .container {
        box-shadow: none;
        border-radius: 0;
      }

      table {
        font-size: 0.8rem;
      }

      th,
      .time-cell {
        position: static;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Student Timetable Generator</h1>
    <p>Create, color-code & save your weekly schedule easily.</p>
  </header>

  <main>
    <div class="controls" aria-label="Timetable controls">
      <div class="control-group">
        <label for="startTime">Start Time</label>
        <input type="time" id="startTime" value="08:00" />
      </div>

      <div class="control-group">
        <label for="endTime">End Time</label>
        <input type="time" id="endTime" value="16:00" />
      </div>

      <div class="control-group">
        <label for="slotDuration">Slot Duration (mins)</label>
        <select id="slotDuration">
          <option value="30">30 min</option>
          <option value="45">45 min</option>
          <option value="60" selected>60 min</option>
          <option value="90">90 min</option>
        </select>
      </div>

      <div class="button-row">
        <button id="generateBtn" type="button" aria-label="Generate timetable">🔄 Generate Timetable</button>
        <button id="clearBtn" type="button" aria-label="Clear timetable">🧹 Clear All</button>
        <button id="printBtn" type="button" aria-label="Print timetable">🖨 Print / Save as PDF</button>
      </div>
    </div>

    <p class="info-text">
      Tip: Your timetable and settings are automatically saved in this browser (localStorage).  
      You can refresh the page without losing data.
    </p>

    <div id="timetableContainer">
      <!-- Timetable will be injected here -->
    </div>
  </main>
</div>

<footer>
  Student Timetable Generator © 2025 – Made with ❤️ using HTML, CSS & JavaScript
</footer>

<script>
  // Constants
  const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
  const STORAGE_KEY = "studentTimetable_v2";
  const STORAGE_SETTINGS_KEY = "studentTimetable_settings_v1";

  // DOM elements
  const startTimeInput = document.getElementById("startTime");
  const endTimeInput = document.getElementById("endTime");
  const slotDurationSelect = document.getElementById("slotDuration");
  const timetableContainer = document.getElementById("timetableContainer");

  const generateBtn = document.getElementById("generateBtn");
  const clearBtn = document.getElementById("clearBtn");
  const printBtn = document.getElementById("printBtn");

  // Event listeners
  generateBtn.addEventListener("click", () => {
    saveSettingsToLocalStorage();
    generateTimetable();
  });

  clearBtn.addEventListener("click", clearTimetable);
  printBtn.addEventListener("click", () => window.print());

  // Auto-load on first load
  document.addEventListener("DOMContentLoaded", () => {
    loadSettingsFromLocalStorage();
    generateTimetable();
  });

  /**
   * Generate timetable table based on settings
   */
  function generateTimetable() {
    const start = startTimeInput.value;
    const end = endTimeInput.value;
    const duration = parseInt(slotDurationSelect.value, 10);

    if (!start || !end) {
      alert("Please set both start and end times!");
      return;
    }

    const startDate = parseTimeToDate(start);
    const endDate = parseTimeToDate(end);

    if (endDate <= startDate) {
      alert("End time must be after start time!");
      return;
    }

    const totalMinutes = (endDate - startDate) / 60000;
    const slotsCount = totalMinutes / duration;

    if (!Number.isInteger(slotsCount)) {
      alert(`The selected duration (${duration} min) does not divide the time range evenly.`);
      return;
    }

    // Generate time labels
    const timeLabels = [];
    let current = new Date(startDate);

    for (let i = 0; i <= slotsCount; i++) {
      timeLabels.push(formatTime(current));
      current = new Date(current.getTime() + duration * 60000);
    }

    // Build table markup
    let tableHTML = `
      <table aria-label="Student timetable">
        <thead>
          <tr>
            <th>Time / Day</th>
            ${DAYS.map(day => `<th scope="col">${day}</th>`).join("")}
          </tr>
        </thead>
        <tbody>
    `;

    for (let i = 0; i < timeLabels.length - 1; i++) {
      const timeStart = timeLabels[i];
      const timeEnd = timeLabels[i + 1];

      tableHTML += `
        <tr>
          <td class="time-cell" scope="row">${timeStart} – ${timeEnd}</td>
          ${DAYS.map((day, dayIndex) => createCellHTML(dayIndex, i)).join("")}
        </tr>
      `;
    }

    tableHTML += `</tbody></table>`;
    timetableContainer.innerHTML = tableHTML;

    attachCellEventListeners();
    loadFromLocalStorage(); // Restore cells from saved data
  }

  /**
   * Convert "HH:MM" to Date object (fixed date)
   */
  function parseTimeToDate(timeString) {
    return new Date(`2025-01-01T${timeString}:00`);
  }

  /**
   * Format Date to "HH:MM" (24-hour)
   */
  function formatTime(date) {
    const hours = String(date.getHours()).padStart(2, "0");
    const mins = String(date.getMinutes()).padStart(2, "0");
    return `${hours}:${mins}`;
  }

  /**
   * Create HTML for a timetable cell
   */
  function createCellHTML(dayIndex, slotIndex) {
    const randomColor = getRandomColor();
    return `
      <td>
        <div class="cell-inner">
          <input
            type="text"
            class="subject-input"
            placeholder="Subject..."
            data-day="${dayIndex}"
            data-slot="${slotIndex}"
          />
          <input
            type="color"
            class="color-picker"
            data-day="${dayIndex}"
            data-slot="${slotIndex}"
            value="${randomColor}"
            aria-label="Pick color for subject"
          />
        </div>
      </td>
    `;
  }

  /**
   * Get a visually pleasing random color
   */
  function getRandomColor() {
    const colors = [
      "#FF6B6B",
      "#4ECDC4",
      "#45B7D1",
      "#96CEB4",
      "#FECA57",
      "#DDA0DD",
      "#98D8C8",
      "#F7DC6F"
    ];
    return colors[Math.floor(Math.random() * colors.length)];
  }

  /**
   * Attach listeners to subject inputs and color pickers
   */
  function attachCellEventListeners() {
    const inputs = document.querySelectorAll(".subject-input");
    const colorPickers = document.querySelectorAll(".color-picker");

    inputs.forEach(inp => {
      inp.addEventListener("input", handleSubjectChange);
      // Optional: clear subject on double-click
      inp.addEventListener("dblclick", () => {
        inp.value = "";
        saveToLocalStorage();
      });
    });

    colorPickers.forEach(picker => {
      // Apply current picker color as a soft background on load
      applyColor(picker);
      picker.addEventListener("input", handleColorChange);
    });
  }

  /**
   * Handle typing in subject fields
   */
  function handleSubjectChange() {
    // Only saving is needed here
    saveToLocalStorage();
  }

  /**
   * Handle color changes
   */
  function handleColorChange(event) {
    const picker = event.target;
    applyColor(picker);
    saveToLocalStorage();
  }

  /**
   * Apply color from picker to matching subject input background
   */
  function applyColor(picker) {
    const day = picker.dataset.day;
    const slot = picker.dataset.slot;

    const selector = `.subject-input[data-day="${day}"][data-slot="${slot}"]`;
    const input = document.querySelector(selector);

    if (input) {
      // Add transparency to the hex color using 8-digit hex (33 ~ 20% opacity)
      input.style.backgroundColor = picker.value + "33";
    }
  }

  /**
   * Save timetable data (subjects + colors) to localStorage
   */
  function saveToLocalStorage() {
    const data = {};

    const inputs = document.querySelectorAll(".subject-input");
    inputs.forEach(inp => {
      const key = `${inp.dataset.day}-${inp.dataset.slot}`;
      if (!data[key]) data[key] = {};
      data[key].subject = inp.value;
    });

    const colorPickers = document.querySelectorAll(".color-picker");
    colorPickers.forEach(col => {
      const key = `${col.dataset.day}-${col.dataset.slot}`;
      if (!data[key]) data[key] = {};
      data[key].color = col.value;
    });

    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {
      console.warn("Could not save timetable data:", e);
    }
  }

  /**
   * Load timetable data from localStorage into current table
   */
  function loadFromLocalStorage() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return;

    let data;
    try {
      data = JSON.parse(saved);
    } catch (e) {
      console.warn("Could not parse saved timetable data:", e);
      return;
    }

    Object.entries(data).forEach(([key, value]) => {
      const [day, slot] = key.split("-");
      const subjectSelector = `.subject-input[data-day="${day}"][data-slot="${slot}"]`;
      const colorSelector = `.color-picker[data-day="${day}"][data-slot="${slot}"]`;

      const input = document.querySelector(subjectSelector);
      const colorPicker = document.querySelector(colorSelector);

      if (input && typeof value.subject === "string") {
        input.value = value.subject;
      }

      if (colorPicker && value.color) {
        colorPicker.value = value.color;
        if (input) {
          input.style.backgroundColor = value.color + "33";
        }
      }
    });
  }

  /**
   * Save global settings (start, end, duration) to localStorage
   */
  function saveSettingsToLocalStorage() {
    const settings = {
      startTime: startTimeInput.value,
      endTime: endTimeInput.value,
      duration: slotDurationSelect.value
    };

    try {
      localStorage.setItem(STORAGE_SETTINGS_KEY, JSON.stringify(settings));
    } catch (e) {
      console.warn("Could not save timetable settings:", e);
    }
  }

  /**
   * Load global settings from localStorage
   */
  function loadSettingsFromLocalStorage() {
    const savedSettings = localStorage.getItem(STORAGE_SETTINGS_KEY);
    if (!savedSettings) return;

    try {
      const settings = JSON.parse(savedSettings);
      if (settings.startTime) startTimeInput.value = settings.startTime;
      if (settings.endTime) endTimeInput.value = settings.endTime;
      if (settings.duration) slotDurationSelect.value = settings.duration;
    } catch (e) {
      console.warn("Could not parse timetable settings:", e);
    }
  }

  /**
   * Clear timetable and localStorage
   */
  function clearTimetable() {
    if (!confirm("Are you sure you want to clear the entire timetable and settings?")) return;

    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(STORAGE_SETTINGS_KEY);

    document.querySelectorAll(".subject-input").forEach(inp => {
      inp.value = "";
      inp.style.backgroundColor = "";
    });

    document.querySelectorAll(".color-picker").forEach(p => {
      p.value = getRandomColor();
      applyColor(p);
    });

    // Reset controls to default
    startTimeInput.value = "08:00";
    endTimeInput.value = "16:00";
    slotDurationSelect.value = "60";
  }
</script>

</body>
</html>
