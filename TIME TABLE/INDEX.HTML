<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Timetable Generator</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    margin: 0;
    padding: 20px;
    color: #333;
  }
  .container {
    max-width: 1100px;
    margin: 0 auto;
    background: #fff;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    overflow: hidden;
  }
  header {
    background: #4a00e0;
    color: white;
    padding: 20px;
    text-align: center;
  }
  h1 { margin: 0; font-size: 2.2em; }
  .controls {
    padding: 20px;
    background: #f8f9fa;
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    justify-content: center;
    align-items: center;
  }
  label, input, select, button {
    font-size: 1em;
  }
  button {
    padding: 10px 20px;
    background: #8e2de2;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
  }
  button:hover { background: #7900c2; }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
  }
  th, td {
    border: 1px solid #ddd;
    padding: 12px;
    text-align: center;
    position: relative;
  }
  th {
    background: #4a00e0;
    color: white;
    font-weight: 600;
  }
  td:hover {
    background: #f0eafb;
  }
  .subject-input {
    width: 100%;
    height: 100%;
    border: none;
    background: transparent;
    text-align: center;
    font-size: 1em;
  }
  .subject-input:focus {
    outline: 2px solid #8e2de2;
    background: #fff;
  }
  .color-picker {
    width: 40px;
    height: 40px;
    border: none;
    cursor: pointer;
  }
  footer {
    text-align: center;
    padding: 15px;
    background: #333;
    color: #ddd;
    font-size: 0.9em;
  }
  @media print {
    body { background: white; }
    .controls, header { display: none; }
    .container { box-shadow: none; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Student Timetable Generator</h1>
    <p>Create your weekly class schedule easily!</p>
  </header>

  <div class="controls">
    <div>
      <label>Start Time:</label>
      <input type="time" id="startTime" value="08:00">
    </div>
    <div>
      <label>End Time:</label>
      <input type="time" id="endTime" value="16:00">
    </div>
    <div>
      <label>Slot Duration (mins):</label>
      <select id="slotDuration">
        <option value="30">30 min</option>
        <option value="45">45 min</option>
        <option value="60" selected>60 min</option>
        <option value="90">90 min</option>
      </select>
    </div>
    <button onclick="generateTimetable()">Generate Timetable</button>
    <button onclick="clearTimetable()">Clear All</button>
    <button onclick="window.print()">Print / Save as PDF</button>
  </div>

  <div id="timetableContainer">
    <!-- Table will be inserted here by JavaScript -->
  </div>
</div>

<footer>
  Student Timetable Generator © 2025 – Made with ❤️ using HTML, CSS & JavaScript
</footer>

<script>
const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

function generateTimetable() {
  const start = document.getElementById("startTime").value;
  const end = document.getElementById("endTime").value;
  const duration = parseInt(document.getElementById("slotDuration").value);

  if (!start || !end) {
    alert("Please set both start and end times!");
    return;
  }

  const startDate = new Date(`2025-01-01 ${start}`);
  const endDate = new Date(`2025-01-01 ${end}`);

  if (endDate <= startDate) {
    alert("End time must be after start time!");
    return;
  }

  // Calculate total minutes and number of slots
  const totalMinutes = (endDate - startDate) / 60000;
  const slotsCount = totalMinutes / duration;

  if (!Number.isInteger(slotsCount)) {
    alert(`The selected duration (${duration} min) does not divide the time range evenly.`);
    return;
  }

  // Generate time labels
  const timeLabels = [];
  let current = new Date(startDate);
  for (let i = 0; i <= slotsCount; i++) {
    timeLabels.push(current.toTimeString().slice(0,5));
    current = new Date(current.getTime() + duration * 60000);
  }

  // Build table HTML
  let tableHTML = `<table>
    <thead>
      <tr>
        <th>Time / Day</th>
        ${days.map(day => `<th>${day}</th>`).join("")}
      </tr>
    </thead>
    <tbody>`;

  for (let i = 0; i < timeLabels.length - 1; i++) {
    const timeStart = timeLabels[i];
    const timeEnd = timeLabels[i+1];
    tableHTML += `
      <tr>
        <td><strong>${timeStart} - ${timeEnd}</strong></td>
        ${days.map((day, dayIndex) => `
          <td>
            <input 
              type="text" 
              class="subject-input" 
              placeholder="Subject..." 
              data-day="${dayIndex}" 
              data-slot="${i}"
              onblur="saveToLocalStorage()">
            <br><br>
            <input 
              type="color" 
              class="color-picker" 
              value="${getRandomColor()}"
              onchange="applyColor(this, ${dayIndex}, ${i})">
          </td>
        `).join("")}
      </tr>`;
  }

  tableHTML += `</tbody></table>`;
  document.getElementById("timetableContainer").innerHTML = tableHTML;

  loadFromLocalStorage();
}

function getRandomColor() {
  const colors = ["#FF6B6B", "#4ECDC4", "#45B7D1", "#96CEB4", "#FECA57", "#DDA0DD", "#98D8C8", "#F7DC6F"];
  return colors[Math.floor(Math.random() * colors.length)];
}

function applyColor(picker, day, slot) {
  const input = picker.parentElement.querySelector(".subject-input");
  input.style.backgroundColor = picker.value + "33"; // 20% opacity
  saveToLocalStorage();
}

function saveToLocalStorage() {
  const inputs = document.querySelectorAll(".subject-input");
  const colors = document.querySelectorAll(".color-picker");
  const data = {};

  inputs.forEach(inp => {
    const key = `${inp.dataset.day}-${inp.dataset.slot}`;
    data[key] = { subject: inp.value };
  });

  colors.forEach(col => {
    const key = `${col.parentElement.querySelector(".subject-input").dataset.day}-${col.parentElement.querySelector(".subject-input").dataset.slot}`;
    if (data[key]) data[key].color = col.value;
  });

  localStorage.setItem("studentTimetable", JSON.stringify(data));
}

function loadFromLocalStorage() {
  const saved = localStorage.getItem("studentTimetable");
  if (!saved) return;

  const data = JSON.parse(saved);
  document.querySelectorAll(".subject-input").forEach(inp => {
    const key = `${inp.dataset.day}-${inp.dataset.slot}`;
    if (data[key]) {
      inp.value = data[key].subject || "";
      const td = inp.parentElement;
      const colorPicker = td.querySelector(".color-picker");
      if (data[key].color) {
        colorPicker.value = data[key].color;
        inp.style.backgroundColor = data[key].color + "33";
      }
    }
  });
}

function clearTimetable() {
  if (confirm("Are you sure you want to clear the entire timetable?")) {
    localStorage.removeItem("studentTimetable");
    document.querySelectorAll(".subject-input").forEach(inp => inp.value = "");
    document.querySelectorAll(".color-picker").forEach(p => p.value = getRandomColor());
    document.querySelectorAll(".subject-input").forEach(inp => inp.style.backgroundColor = "");
  }
}

// Generate a default timetable on first load
window.onload = () => generateTimetable();
</script>

</body>
</html>
