<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FunBox — Instant Laughs Guaranteed</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1020;
      --card: rgba(255,255,255,0.05);
      --text: #ffffff;
      --muted: #9aa3b2;
      --accent: #ffcc00;
      --accent-dark: #e6b800;
      --glass: rgba(255,255,255,0.06);
      --shadow: rgba(0,0,0,0.6);
      --border: rgba(255,255,255,0.08);
    }
    [data-theme="light"] {
      --bg: #f8f9fc;
      --card: rgba(255,255,255,0.9);
      --text: #1a1a1a;
      --muted: #666;
      --accent: #ffaa00;
      --shadow: rgba(0,0,0,0.15);
      --border: rgba(0,0,0,0.1);
      --glass: rgba(255,255,255,0.7);
    }

    * { box-sizing: border-box; margin:0; padding:0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 16px;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(255,204,0,0.08), transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(100,200,255,0.06), transparent 20%);
      transition: background 0.5s ease;
    }

    .wrap { width: 100%; max-width: 1000px; }

    header {
      display: flex; align-items: center; gap: 16px; margin-bottom: 20px;
    }
    .logo {
      width: 76px; height: 76px; border-radius: 18px;
      background: linear-gradient(135deg, #fffbe6, #ffd700);
      display: grid; place-items: center; font-size: 42px;
      box-shadow: 0 12px 32px var(--shadow);
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 { font-size: 1.5rem; font-weight: 700; }
    .sub { font-size: 0.95rem; color: var(--muted); margin-top: 4px; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 16px;
    }
    @media (max-width: 920px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 40px var(--shadow);
      border: 1px solid var(--border);
    }

    .main-card {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 600px) {
      .main-card { grid-template-columns: 1fr; text-align: center; }
    }

    .mascot {
      width: 130px; height: 130px; border-radius: 20px;
      background: linear-gradient(135deg, #ffffff, #fff6c2);
      font-size: 68px;
      display: grid; place-items: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.3);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
    }
    .mascot.dance {
      transform: translateY(-12px) rotate(-12deg) scale(1.1) !important;
    }

    .output {
      min-height: 80px;
      padding: 16px;
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      font-size: 1.15rem;
      line-height: 1.5;
      border: 1px dashed var(--border);
      margin: 16px 0;
      display: flex;
      align-items: center;
    }

    .controls, .actions {
      display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px;
    }
    button, select {
      padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border);
      background: rgba(255,255,255,0.06); color: var(--text);
      font-weight: 600; cursor: pointer; transition: all 0.2s ease;
    }
    button:hover { background: rgba(255,255,255,0.12); }
    button.primary {
      background: var(--accent); color: #000; border: none;
      box-shadow: 0 8px 25px rgba(255,204,0,0.3);
    }
    button.primary:hover {
      background: var(--accent-dark);
      transform: translateY(-2px);
    }

    .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 9999; }
    .confetti .p {
      position: absolute; width: 12px; height: 16px;
      background: #ffcc00; border-radius: 2px;
      animation: confetti-fall linear forwards;
    }
    @keyframes confetti-fall {
      to { transform: translateY(120vh) rotate(720deg); opacity: 0; }
    }

    footer { margin-top: 24px; text-align: center; color: var(--muted); font-size: 0.9rem; }

    .theme-toggle {
      position: fixed; top: 16px; right: 16px; z-index: 100;
      background: var(--card); padding: 10px; border-radius: 50%;
      font-size: 1.4rem; cursor: pointer; border: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark mode">🌙</button>

  <div class="wrap">
    <header>
      <div class="logo" aria-hidden="true">Laughing Cow Emoji</div>
      <div>
        <h1>FunBox</h1>
        <div class="sub">Your Instant Laugh Machine — Now with 200% more cowbell</div>
      </div>
    </header>

    <div class="grid">
      <section class="card main-card" aria-labelledby="main-heading">
        <div class="mascot" id="mascot" role="img" aria-label="FunBox mascot">Cow Emoji</div>

        <div>
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
            <select id="mode" aria-label="Select humor mode">
              <option value="joke">Random Joke</option>
              <option value="guj">Gujarati Joke</option>
              <option value="roast">Soft Roast</option>
              <option value="fortune">Absurd Fortune</option>
              <option value="fact">Stupid Fact</option>
            </select>
            <button id="goBtn" class="primary">Make Me Laugh!</button>
          </div>

          <div id="output" class="output" tabindex="0" aria-live="polite">
            Ready to laugh? Hit the button or press <kbd>Space</kbd>!
          </div>

          <div class="actions">
            <button id="speakBtn">Speak</button>
            <button id="copyBtn">Copy</button>
            <button id="shareBtn">Share</button>
            <button id="confettiBtn">Confetti</button>
          </div>

          <div class="controls">
            <select id="voiceSelect"></select>
            <button id="longBtn">Long Version</button>
          </div>

          <details style="margin-top:16px">
            <summary style="cursor:pointer; color:var(--muted); font-size:0.9rem">Past laughs (click to expand)</summary>
            <div id="history" style="margin-top:8px; font-size:0.9rem; color:var(--muted); line-height:1.6"></div>
          </details>
        </div>
      </section>

      <aside>
        <div class="card">
          <h2>Quick Modes</h2>
          <div class="actions" style="margin-top:12px">
            <button data-mode="joke">Joke</button>
            <button data-mode="guj">Gujarati</button>
            <button data-mode="roast">Roast</button>
            <button data-mode="fortune">Fortune</button>
          </div>
        </div>

        <div class="card">
          <h2>Customize</h2>
          <label class="muted" style="font-size:0.85rem; display:block; margin:12px 0 6px">Mascot Emoji</label>
          <input id="mascotInput" placeholder="e.g. Cat, Alien, Pizza" style="width:100%; padding:10px; border-radius:10px; border:1px solid var(--border); background:transparent; color:var(--text)" />
          
          <label class="muted" style="font-size:0.85rem; display:block; margin:12px 0 6px">Dance Speed</label>
          <input type="range" id="speed" min="0.3" max="3" step="0.1" value="1" style="width:100%">
        </div>

        <div class="card">
          <h2>Favorites</h2>
          <div class="actions">
            <button id="saveBtn">Save Current</button>
            <button id="exportBtn">Export All</button>
          </div>
          <div id="favCount" style="margin-top:8px; font-size:0.85rem; color:var(--muted)">0 saved</div>
        </div>
      </aside>
    </div>

    <footer>Made with love, zero ads, maximum silliness</footer>
  </div>

  <div class="confetti" id="confettiContainer"></div>

  <script type="module">
    // === DATA ===
    const content = {
      joke: [
        "Why did the scarecrow win an award? He was outstanding in his field.",
        "I told my tractor a joke. It didn't laugh — too much exhaust.",
        "My cow started a band called 'Moo Tang Clan'. It's fire.",
        "Why don't farmers ever get lost? Because they always follow the plow."
      ],
      guj: [
        "એક વખત ખેડૂતે કહ્યું: 'હું ગાય સાથે બોલું છું.' મિત્ર: 'શું કહે?' ખેડૂત: 'બસ, દુધ વધારે આપવા કહું છું!'",
        "પત્ની: 'આજે શું લાવ્યા?' ખેડૂત: 'બે કિલો ખુશી અને એક કિલો ચિંતા.'",
        "ગુજરાતી જોક: 'બધું વેચાઈ ગયું, હવે માત્ર મારી પાસે આશા બચી છે — એ પણ EMI પર.'"
      ],
      roast: [
        "You code like a farmer plants — full of hope and zero planning.",
        "Your brain runs on Windows Vista.",
        "You're the reason we have loading screens.",
        "Even your shadow leaves when things get serious."
      ],
      fortune: [
        "Tomorrow, a pigeon will judge your outfit.",
        "Your plants are gossiping about you.",
        "Good news: You will find a sock. Bad news: Only one."
      ],
      fact: [
        "Octopuses have three hearts — two for swimming, one for breaking up with squid.",
        "A group of flamingos is called a 'flamboyance'. Iconic.",
        "Cows have best friends and get stressed when separated."
      ]
    };

    // === DOM Elements ===
    const els = {
      output: document.getElementById('output'),
      mascot: document.getElementById('mascot'),
      mode: document.getElementById('mode'),
      goBtn: document.getElementById('goBtn'),
      history: document.getElementById('history'),
      voiceSelect: document.getElementById('voiceSelect'),
      speakBtn: document.getElementById('speakBtn'),
      copyBtn: document.getElementById('copyBtn'),
      shareBtn: document.getElementById('shareBtn'),
      confettiBtn: document.getElementById('confettiBtn'),
      confettiContainer: document.getElementById('confettiContainer'),
      longBtn: document.getElementById('longBtn'),
      saveBtn: document.getElementById('saveBtn'),
      exportBtn: document.getElementById('exportBtn'),
      mascotInput: document.getElementById('mascotInput'),
      speed: document.getElementById('speed'),
      themeToggle: document.getElementById('themeToggle'),
      favCount: document.getElementById('favCount')
    };

    // === State ===
    let state = {
      history: JSON.parse(localStorage.getItem('funbox_history') || '[]').slice(0, 15),
      favorites: JSON.parse(localStorage.getItem('funbox_favorites') || '[]'),
      mascot: localStorage.getItem('funbox_mascot') || 'Cow Emoji',
      speed: parseFloat(localStorage.getItem('funbox_speed') || '1'),
      theme: localStorage.getItem('funbox_theme') || 'dark'
    };

    // Apply saved theme
    document.documentElement.dataset.theme = state.theme;
    els.themeToggle.textContent = state.theme === 'dark' ? 'Sun' : 'Moon';

    // === Core Functions ===
    const rand = arr => arr[Math.floor(Math.random() * arr.length)];

    function generate(long = false) {
      const mode = els.mode.value;
      let text = rand(content[mode] || content.joke);

      if (long && mode !== 'guj') {
        text += " " + rand(["(Extended cut: the cow laughed so hard it started a union.)", "Bonus: the chicken was in on it.", "P.S. this joke has layers."]);
      }

      els.output.textContent = text;
      pushHistory(text);
      dance();
    }

    function pushHistory(text) {
      state.history.unshift(text.slice(0, 100) + (text.length > 100 ? '...' : ''));
      state.history = state.history.slice(0, 15);
      els.history.textContent = state.history.join(' • ') || '— no laughs yet —';
      localStorage.setItem('funbox_history', JSON.stringify(state.history));
    }

    function dance() {
      els.mascot.classList.add('dance');
      setTimeout(() => els.mascot.classList.remove('dance'), 600 / state.speed);
    }

    function throwConfetti() {
      const colors = ['#ffcc00', '#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#feca57'];
      for (let i = 0; i < 40; i++) {
        const p = document.createElement('div');
        p.className = 'p';
        p.style.left = Math.random() * 100 + '%';
        p.style.background = rand(colors);
        p.style.animationDuration = 1 + Math.random() * 2 + 's';
        p.style.animationDelay = Math.random() * 0.5 + 's';
        p.style.transform = `rotate(${Math.random() * 360}deg)`;
        els.confettiContainer.appendChild(p);
      }
      setTimeout(() => els.confettiContainer.innerHTML = '', 3000);
      dance();
    }

    function speak() {
      if (!els.output.textContent || els.output.textContent.includes('Ready to laugh')) return;
      const utter = new SpeechSynthesisUtterance(els.output.textContent);
      const voiceIdx = els.voiceSelect.value;
      if (voiceIdx && voices[voiceIdx]) utter.voice = voices[voiceIdx];
      utter.rate = 0.9;
      speechSynthesis.cancel();
      speechSynthesis.speak(utter);
    }

    // === Voice Setup ===
    let voices = [];
    function loadVoices() {
      voices = speechSynthesis.getVoices()
        .filter(v => v.lang.includes('en') || v.lang.includes('gu') || v.lang.includes('hi'));
      els.voiceSelect.innerHTML = '<option value="">Default Voice</option>' +
        voices.map((v, i) => `<option value="${i}">${v.name} (${v.lang})</option>`).join('');
    }
    speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    // === Persistence & UI Updates ===
    function updateMascot() {
      const emoji = state.mascot.trim() || 'Cow Emoji';
      els.mascot.textContent = emoji.length > 4 ? emoji.slice(0, 4) : emoji;
      els.mascotInput.value = state.mascot;
      localStorage.setItem('funbox_mascot', state.mascot);
    }

    els.mascotInput.addEventListener('input', (e) => {
      state.mascot = e.target.value;
      updateMascot();
    });

    els.speed.addEventListener('input', (e) => {
      state.speed = parseFloat(e.target.value);
      localStorage.setItem('funbox_speed', state.speed);
    });
    els.speed.value = state.speed;

    function updateFavoritesCount() {
      els.favCount.textContent = `${state.favorites.length} saved`;
    }

    function saveFavorite() {
      const text = els.output.textContent;
      if (!text || text.includes('Ready to laugh')) return;
      if (!state.favorites.includes(text)) {
        state.favorites.push(text);
        localStorage.setItem('funbox_favorites', JSON.stringify(state.favorites));
        updateFavoritesCount();
        els.saveBtn.textContent = 'Saved!';
        setTimeout(() => els.saveBtn.textContent = 'Save Current', 1000);
      }
    }

    function exportFavorites() {
      const text = state.favorites.length ? state.favorites.join('\n\n══════════════════\n\n') : els.output.textContent;
      const blob = new Blob([text], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `funbox-laughs-${new Date().toISOString().slice(0,10)}.txt`;
      a.click();
    }

    // === Event Listeners ===
    els.goBtn.addEventListener('click', () => generate());
    document.querySelectorAll('[data-mode]').forEach(b => {
      b.addEventListener('click', () => {
        els.mode.value = b.dataset.mode;
        generate();
      });
    });

    els.speakBtn.addEventListener('click', speak);
    els.copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(els.output.textContent);
        els.copyBtn.textContent = 'Copied!';
        setTimeout(() => els.copyBtn.textContent = 'Copy', 1200);
      } catch { alert('Copy failed'); }
    });

    els.shareBtn.addEventListener('click', () => {
      if (navigator.share) {
        navigator.share({ title: 'FunBox Laugh', text: els.output.textContent });
      } else {
        prompt('Share this laugh:', els.output.textContent);
      }
    });

    els.confettiBtn.addEventListener('click', throwConfetti);
    els.longBtn.addEventListener('click', () => generate(true));
    els.saveBtn.addEventListener('click', saveFavorite);
    els.exportBtn.addEventListener('click', exportFavorites);

    document.addEventListener('keydown', e => {
      if (e.code === 'Space' && e.target === document.body) {
        e.preventDefault();
        generate();
      }
    });

    els.themeToggle.addEventListener('click', () => {
      const newTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = newTheme;
      localStorage.setItem('funbox_theme', newTheme);
      els.themeToggle.textContent = newTheme === 'dark' ? 'Sun' : 'Moon';
    });

    // === Init ===
    updateMascot();
    pushHistory("App loaded — ready for laughs!");
    updateFavoritesCount();
    setTimeout(() => generate(), 800);
  </script>
</body>
</html>
