<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modern Calculator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .calculator {
      background: #1e1e2f;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      width: 320px;
    }

    .display {
      width: 100%;
      height: 100px;
      background: #0f0f1e;
      border-radius: 12px;
      margin-bottom: 20px;
      padding: 15px;
      text-align: right;
      color: white;
      font-size: 2.2rem;
      overflow: hidden;
      border: none;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.5);
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 70px;
      border: none;
      border-radius: 12px;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
    }

    }

    button:active {
      transform: translateY(1px);
    }

    .number, .decimal {
      background: #3a3a5c;
      color: white;
    }

    .operator {
      background: #ff9500;
      color: white;
    }

    .equals {
      background: #00d26a;
      color: white;
      grid-column: span 2;
    }

    .clear, .delete {
      background: #ff4757;
      color: white;
    }

    .zero {
      grid-column: span 2;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <input type="text" class="display" id="display" readonly />

    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button class="delete" onclick="deleteLast()">DEL</button>
      <button class="operator" onclick="appendToDisplay('%')">%</button>
      <button class="operator" onclick="appendToDisplay('/')">÷</button>

      <button class="number" onclick="appendToDisplay('7')">7</button>
      <button class="number" onclick="appendToDisplay('8')">8</button>
      <button class="number" onclick="appendToDisplay('9')">9</button>
      <button class="operator" onclick="appendToDisplay('*')">×</button>

      <button class="number" onclick="appendToDisplay('4')">4</button>
      <button class="number" onclick="appendToDisplay('5')">5</button>
      <button class="number" onclick="appendToDisplay('6')">6</button>
      <button class="operator" onclick="appendToDisplay('-')">−</button>

      <button class="number" onclick="appendToDisplay('1')">1</button>
      <button class="number" onclick="appendToDisplay('2')">2</button>
      <button class="number" onclick="appendToDisplay('3')">3</button>
      <button class="operator" onclick="appendToDisplay('+')">+</button>

      <button class="zero number" onclick="appendToDisplay('0')">0</button>
      <button class="decimal number" onclick="appendToDisplay('.')">.</button>
      <button class="equals" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function appendToDisplay(value) {
      // Prevent multiple operators in a row (except after '(' or at start)
      const lastChar = display.value.slice(-1);
      const operators = ['+', '-', '*', '/', '%', '/'];

      if (operators.includes(value) && operators.includes(lastChar) && display.value !== '') {
        // Replace the last operator instead of adding a new one
        display.value = display.value.slice(0, -1) + value;
      } else {
        display.value += value;
      }
    }

    function clearDisplay() {
      display.value = '';
    }

    function deleteLast() {
      display.value = display.value.slice(0, -1);
    }

    function calculate() {
      try {
        // Replace display symbols with JS equivalents
        let expression = display.value
          .replace(/×/g, '*')
          .replace(/÷/g, '/')
          .replace(/−/g, '-');

        // Prevent division by zero
        if (expression.includes('/0') && !expression.includes('/0.')) {
          display.value = "Error";
          return;
        }

        // Use eval safely (only for simple calculator operations)
        const result = eval(expression);

        // Format result
        if (isNaN(result) || !isFinite(result)) {
          display.value = "Error";
        } else {
          display.value = parseFloat(result.toFixed(8)); // Limit decimal places
        }
      } catch (error) {
        display.value = "Error";
      }
    }

    // Keyboard support
    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') appendToDisplay(e.key);
      if (e.key === '.') appendToDisplay('.');
      if (e.key === '+' || e.key === '-') appendToDisplay(e.key);
      if (e.key === '*') appendToDisplay('*');
      if (e.key === '/') appendToDisplay('/');
      if (e.key === 'Enter' || e.key === '=') calculate();
      if (e.key === 'Backspace') deleteLast();
      if (e.key === 'Escape') clearDisplay();
    });
  </script>
</body>
</html>
