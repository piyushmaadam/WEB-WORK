<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer Project</title>
    <style>
        /* ===== RESET & BASE STYLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a73e8, #4a148c);
            transition: background 0.3s ease, color 0.3s ease;
            color: #fff;
        }

        body.dark {
            background: radial-gradient(circle at top, #020617, #020617);
            color: #e5e7eb;
        }

        .container {
            width: 95%;
            max-width: 650px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 24px 20px 28px;
            backdrop-filter: blur(10px);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        h1 {
            font-size: 1.6rem;
            letter-spacing: 1px;
        }

        .theme-toggle {
            padding: 6px 14px;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            background-color: rgba(255, 255, 255, 0.16);
            color: inherit;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .theme-toggle:hover {
            background-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .description {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 16px;
        }

        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        input[type="datetime-local"] {
            flex: 1;
            min-width: 180px;
            padding: 8px 10px;
            border-radius: 8px;
            border: none;
            outline: none;
        }

        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button.primary,
        button.secondary {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            min-width: 90px;
            transition: transform 0.06s ease, box-shadow 0.06s ease, opacity 0.2s ease;
        }

        button.primary {
            background-color: #22c55e;
            color: #fff;
        }

        button.primary:hover {
            background-color: #16a34a;
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(22, 163, 74, 0.5);
        }

        button.secondary {
            background-color: rgba(15, 23, 42, 0.6);
            color: #e5e7eb;
        }

        button.secondary:hover {
            background-color: rgba(15, 23, 42, 0.9);
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(15, 23, 42, 0.7);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .error {
            color: #fca5a5;
            font-size: 0.8rem;
            min-height: 16px;
            margin-bottom: 8px;
        }

        .timer-display {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 12px 0;
        }

        .time-box {
            background: rgba(15, 23, 42, 0.4);
            border-radius: 12px;
            padding: 10px 6px;
            text-align: center;
            transition: transform 0.1s ease, background 0.2s ease;
        }

        body.dark .time-box {
            background: rgba(15, 23, 42, 0.9);
        }

        .time-box:hover {
            transform: translateY(-2px);
        }

        .time-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .time-label {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .status {
            font-size: 0.9rem;
            margin-top: 4px;
            min-height: 18px;
        }

        .target-text {
            font-size: 0.8rem;
            opacity: 0.8;
            margin-top: 2px;
            min-height: 16px;
        }

        .footer-text {
            text-align: center;
            font-size: 0.75rem;
            opacity: 0.7;
            margin-top: 10px;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.3rem;
            }

            .timer-display {
                grid-template-columns: repeat(2, 1fr);
            }

            .container {
                padding: 18px 14px 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Countdown Timer</h1>
            <button class="theme-toggle" id="themeToggle">Dark Mode</button>
        </div>

        <p class="description">
            Select a future date and time, then click <strong>Start</strong> to begin the countdown.
        </p>

        <div class="form-group">
            <input type="datetime-local" id="datetimeInput">
            <div class="button-group">
                <button class="primary" id="startBtn">Start</button>
                <button class="secondary" id="resetBtn" disabled>Reset</button>
            </div>
        </div>

        <div class="error" id="errorMsg"></div>

        <div class="timer-display">
            <div class="time-box">
                <div class="time-value" id="days">0</div>
                <div class="time-label">Days</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="hours">00</div>
                <div class="time-label">Hours</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="minutes">00</div>
                <div class="time-label">Minutes</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="seconds">00</div>
                <div class="time-label">Seconds</div>
            </div>
        </div>

        <div class="status" id="statusText"></div>
        <div class="target-text" id="targetText"></div>

        <p class="footer-text">
            Made with HTML, CSS &amp; JavaScript ✨
        </p>
    </div>

    <script>
        // ===== ELEMENT REFERENCES =====
        const datetimeInput = document.getElementById("datetimeInput");
        const startBtn = document.getElementById("startBtn");
        const resetBtn = document.getElementById("resetBtn");
        const errorMsg = document.getElementById("errorMsg");
        const statusText = document.getElementById("statusText");
        const targetText = document.getElementById("targetText");

        const daysEl = document.getElementById("days");
        const hoursEl = document.getElementById("hours");
        const minutesEl = document.getElementById("minutes");
        const secondsEl = document.getElementById("seconds");

        const themeToggle = document.getElementById("themeToggle");
        let countdownInterval = null;
        let currentTargetTime = null;

        // ===== THEME HANDLING (WITH LOCALSTORAGE) =====
        const THEME_KEY = "countdown_theme";

        function applyTheme(theme) {
            if (theme === "dark") {
                document.body.classList.add("dark");
                themeToggle.textContent = "Light Mode";
            } else {
                document.body.classList.remove("dark");
                themeToggle.textContent = "Dark Mode";
            }
        }

        // Load saved theme
        const savedTheme = localStorage.getItem(THEME_KEY) || "light";
        applyTheme(savedTheme);

        themeToggle.addEventListener("click", () => {
            const isDark = document.body.classList.toggle("dark");
            const newTheme = isDark ? "dark" : "light";
            localStorage.setItem(THEME_KEY, newTheme);
            applyTheme(newTheme);
        });

        // ===== BUTTON STATES =====
        function setRunningState(isRunning) {
            startBtn.disabled = isRunning;
            resetBtn.disabled = !isRunning && !currentTargetTime;
            if (isRunning) {
                startBtn.textContent = "Running...";
            } else {
                startBtn.textContent = "Start";
            }
        }

        // ===== START BUTTON CLICK =====
        startBtn.addEventListener("click", () => {
            const value = datetimeInput.value;

            errorMsg.textContent = "";
            statusText.textContent = "";
            targetText.textContent = "";

            if (countdownInterval) {
                clearInterval(countdownInterval);
            }

            if (!value) {
                errorMsg.textContent = "Please choose a date and time.";
                return;
            }

            const targetTime = new Date(value).getTime();
            const now = Date.now();

            if (isNaN(targetTime)) {
                errorMsg.textContent = "Invalid date format.";
                return;
            }

            if (targetTime <= now) {
                errorMsg.textContent = "Please select a future date and time.";
                return;
            }

            currentTargetTime = targetTime;
            const readableDate = new Date(targetTime).toLocaleString();
            statusText.textContent = "Countdown started...";
            targetText.textContent = "Target time: " + readableDate;

            setRunningState(true);
            runCountdown(targetTime);
        });

        // ===== RESET BUTTON =====
        resetBtn.addEventListener("click", () => {
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
            currentTargetTime = null;
            datetimeInput.value = "";
            errorMsg.textContent = "";
            statusText.textContent = "Timer reset.";
            targetText.textContent = "";

            daysEl.textContent = "0";
            hoursEl.textContent = "00";
            minutesEl.textContent = "00";
            secondsEl.textContent = "00";

            setRunningState(false);
        });

        // ===== COUNTDOWN FUNCTION =====
        function runCountdown(targetTime) {
            updateDisplay(targetTime);

            countdownInterval = setInterval(() => {
                const finished = updateDisplay(targetTime);
                if (finished) {
                    clearInterval(countdownInterval);
                    statusText.textContent = "Time's up! 🎉";
                    currentTargetTime = null;
                    setRunningState(false);
                }
            }, 1000);
        }

        // Returns true if countdown finished
        function updateDisplay(targetTime) {
            const now = Date.now();
            let diff = targetTime - now;

            if (diff <= 0) {
                diff = 0;
            }

            const seconds = Math.floor(diff / 1000) % 60;
            const minutes = Math.floor(diff / (1000 * 60)) % 60;
            const hours = Math.floor(diff / (1000 * 60 * 60)) % 24;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));

            daysEl.textContent = days;
            hoursEl.textContent = String(hours).padStart(2, "0");
            minutesEl.textContent = String(minutes).padStart(2, "0");
            secondsEl.textContent = String(seconds).padStart(2, "0");

            return diff === 0;
        }

        // Initial state
        setRunningState(false);
    </script>
</body>
</html>
